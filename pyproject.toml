[project]
name = "ecopulse-ca"
version = "0.1.0"
description = "An open station-level air quality benchmark for Central Asia, with pre-registered spatial and temporal splits."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jaloliddin Musayev" }]

# Pinned to 3.12, NOT the 3.14 installed on the dev machine: the geospatial stack
# (pyproj, netCDF4, xarray, rasterio) does not yet publish reliable 3.14 wheels.
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.3,<5",
    "pyarrow>=16",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "tenacity>=8.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

# Optional, and deliberately outside `dev`: `scripts/build_pdf.py` renders the submission
# PDF and is not part of `make reproduce`. The usual pandoc + LaTeX route needs system
# packages that a reviewer may not have, so this chain is pure Python and installs anywhere
# the project installs. pdfminer.six is used by the build to verify its own output --
# a PDF that exists is not a PDF that rendered correctly.
#     python -m pip install -e ".[pdf]" && python scripts/build_pdf.py
pdf = [
    "markdown>=3.6",
    "xhtml2pdf>=0.2.16",
    "pdfminer.six>=20240706",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecopulse_ca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test requires live network credentials (deselect with -m 'not network')",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Extraction/training scripts must mutate sys.path before importing the package, because
# they run standalone against the repo checkout rather than an installed distribution.
# E402 is therefore unavoidable there and is exempted deliberately -- NOT suppressed
# across the codebase, where an out-of-order import is still an error.
"scripts/*.py" = ["E402"]
"paper/scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# --- Reproducibility contract -------------------------------------------------
# Every number in the paper is substituted at render time from paper/numbers.json, which
# paper/scripts/extract_numbers.py derives from paper/tables/*.csv. Enforced by
# tests/test_manuscript_numbers.py (re-extraction must be drift-free) and
# tests/test_table_provenance.py (every table has a producer inside `reproduce`).
[tool.ecopulse]
seeds = [0, 1, 2, 3, 4]
random_splits_allowed = false
